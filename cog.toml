from_latest_tag = true
skip_untracked = true

pre_bump_hooks = [
    "mvn versions:set -DnewVersion={{version}} -DgenerateBackupPoms=false",
    "git add pom.xml"
]

[git_hooks.pre-commit]
script = """#!/bin/sh
gitleaks protect --staged --verbose
"""

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]
